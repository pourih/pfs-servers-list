name: Sync text file from upstream

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 min (at :07 and :37 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: sync-upstream
      cancel-in-progress: false
    env:
      # One source per line. To add another source, add a new line.
      SOURCE_URLS: |
        https://raw.githubusercontent.com/miladtahanian/V2RayCFGDumper/main/sub.txt
        https://raw.githubusercontent.com/iampedii/whitedns-sub/main/base64.txt
        https://raw.githubusercontent.com/Au1rxx/free-vpn-subscriptions/main/output/v2ray-base64.txt
        https://raw.githubusercontent.com/roosterkid/openproxylist/main/V2RAY_RAW.txt
        https://raw.githubusercontent.com/MahanKenway/Freedom-V2Ray/main/configs/vless.txt
      # One target file per line. All listed files receive identical content.
      TARGET_FILES: |
        verified.txt
        pfs_servers.txt
        lms.txt
        clean.txt
      NAMES_FILE: names.json   # remembers which name each server got

    steps:
      - name: Check out your repo
        uses: actions/checkout@v4

      - name: Download the sources
        run: |
          ok=0
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            # Try up to 3 more times if a transient download error occurs
            if curl -fsSL --retry 3 --retry-delay 5 --max-time 60 \
                 "$url" -o "$RUNNER_TEMP/current.txt"; then
              cat "$RUNNER_TEMP/current.txt" >> "$RUNNER_TEMP/all.txt"
              echo >> "$RUNNER_TEMP/all.txt"
              ok=$((ok + 1))
            else
              echo "::warning::Could not download $url - skipping it."
            fi
          done <<< "$SOURCE_URLS"

          # Only fail if every source is down
          if [ "$ok" -eq 0 ]; then
            echo "All sources failed; aborting." >&2
            exit 1
          fi

      - name: Merge and name the servers
        run: |
          python3 scripts/merge.py "$RUNNER_TEMP/all.txt" > "$RUNNER_TEMP/merged.txt"

          if [ ! -s "$RUNNER_TEMP/merged.txt" ]; then
            echo "Merged result is empty; aborting." >&2
            exit 1
          fi

          # Fast-forward in case a commit landed while sources were downloading
          git pull --rebase

          python3 scripts/rename.py "$RUNNER_TEMP/merged.txt" "$NAMES_FILE" \
            "$RUNNER_TEMP/names.json" > "$RUNNER_TEMP/named.txt"

          # Only now touch the repo files, so a failure above changes nothing
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            cp "$RUNNER_TEMP/named.txt" "$file"
          done <<< "$TARGET_FILES"

          cp "$RUNNER_TEMP/names.json" "$NAMES_FILE"

      - name: Commit and push if the files changed
        run: |
          FILES=()
          while IFS= read -r file; do
            [ -n "$file" ] && FILES+=("$file")
          done <<< "$TARGET_FILES"

          if [ -n "$(git status --porcelain -- "${FILES[@]}" "$NAMES_FILE")" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- "${FILES[@]}" "$NAMES_FILE"
            git commit -m "Sync server lists from upstream"
            git push
          else
            echo "No changes upstream."
          fi
